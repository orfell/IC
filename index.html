<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consulta de notas</title>
  <style>
    :root{--azul:#0064bd;--gris:#6f7982;--fondo:#edf2f5;--texto:#111827}
    *{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:var(--texto);font-family:Arial,sans-serif}
    .pagina{width:min(650px,100%);min-height:100vh;margin:auto;padding:26px 29px 30px;background:#fff;box-shadow:0 2px 18px #00000012}
    .logo{display:block;width:min(519px,100%);height:182px;object-fit:contain;margin:0 auto 4px}
    .separador{border:0;border-top:1px solid #d7dee3;margin:0 44px 20px}
    .encabezado{text-align:center;font-weight:700;font-size:16px;line-height:1.4;margin-bottom:14px}
    .consulta{margin-top:28px;padding:19px 28px;background:var(--fondo);border-radius:7px}
    .consulta h2{font-size:16px;text-align:center;margin:0 0 12px}
    .acciones{display:grid;grid-template-columns:1fr 111px 95px;gap:14px}
    input,button{min-height:39px;border-radius:5px;font:inherit}input{width:100%;padding:8px 12px;border:1px solid #c8cdd2;font-size:15px}
    button{border:0;color:#fff;font-weight:700;cursor:pointer;background:var(--azul)}button[type=button]{background:var(--gris)}button:hover{filter:brightness(.94)}
    .mensaje{display:none;margin:12px 0 0;text-align:center;font-weight:700;color:#b42318}.resultado{display:none;margin-top:28px}
    .datos{display:grid;grid-template-columns:130px 1fr;margin-bottom:23px}.datos strong,.datos span{min-height:31px;padding:6px 9px;border-bottom:1px solid #111}
    .datos strong{padding-left:0;border-bottom-color:transparent}.datos span{border-left:1px solid #111;border-right:1px solid #111}.datos span:first-of-type{border-top:1px solid #111}
    table{width:100%;border-collapse:collapse;margin-bottom:25px;table-layout:fixed}th,td{border:1px solid #111;padding:6px 9px;text-align:center}
    th{background:#8d8d8d;color:#fff}td:first-child{text-align:left;font-weight:700}.definitiva{display:grid;grid-template-columns:66% 34%;align-items:center;font-weight:700}
    .nota-final{width:100%;min-height:32px;border:1px solid #111;padding:6px 9px;display:flex;align-items:center;justify-content:center;font-size:16px}.perdida{color:#d00000;font-weight:700}
    @media(max-width:560px){.pagina{width:100%;padding:14px 12px 22px;box-shadow:none}.logo{width:100%;height:128px}.separador{margin:0 4px 15px}.encabezado{font-size:14px;line-height:1.45}.consulta{margin-top:20px;padding:16px 12px}.consulta h2{font-size:15px}.acciones{grid-template-columns:1fr 1fr;gap:10px}.acciones input{grid-column:1/-1;font-size:16px}.resultado{margin-top:22px}.datos{grid-template-columns:105px minmax(0,1fr);font-size:13px;margin-bottom:18px}.datos strong,.datos span{padding:6px 5px;overflow-wrap:anywhere}table{font-size:13px;margin-bottom:20px}th,td{padding:7px 4px}.definitiva{font-size:14px}.nota-final{font-size:15px}}
    @media(max-width:360px){.logo{height:110px}.acciones{grid-template-columns:1fr}.acciones input{grid-column:auto}.datos{grid-template-columns:92px minmax(0,1fr);font-size:12px}table{font-size:12px}}
  </style>
</head>
<body>
<main class="pagina">
  <img id="logo" class="logo" alt="Logo institucional">
  <hr class="separador">
  <header class="encabezado"><span id="titulo"></span><br><span id="periodo"></span><br><span id="asignatura"></span><br><span id="programa"></span><br><span id="docente"></span></header>
  <hr class="separador">
  <section class="consulta">
    <h2>Consulta de Notas - Estudiantes</h2>
    <form id="formulario" class="acciones">
      <input id="documento" inputmode="numeric" autocomplete="off" placeholder="Ej: 1.058.966.757" aria-label="Documento de identificación">
      <button type="submit">Consultar</button><button type="button" id="limpiar">Limpiar</button>
    </form>
    <p id="mensaje" class="mensaje" role="alert">Documento no encontrado</p>
  </section>
  <section id="resultado" class="resultado" aria-live="polite">
    <div class="datos"><strong>Identificación</strong><span id="idSalida"></span><strong>Nombre</strong><span id="nombreSalida"></span><strong>Programa:</strong><span id="programaSalida"></span></div>
    <table><colgroup><col style="width:33%"><col style="width:17%"><col style="width:16%"><col style="width:34%"></colgroup>
      <thead><tr><th>Actividad</th><th>Nota</th><th>%</th><th>Acumulado</th></tr></thead><tbody id="filas"></tbody>
    </table>
    <div class="definitiva"><span>Definitiva</span><span id="definitiva" class="nota-final"></span></div>
  </section>
</main>
<script>
/* EDITAR SOLO ESTE BLOQUE DE CONFIGURACIÓN Y DATOS. */
const CONFIG={
  titulo:"Socialización de Notas",
  periodo:"Período 2026-II",
  asignatura:"Algoritmo y Programación",
  programa:"Ingeniería Civil",
  codigoPrograma:"IC",
  docente:"Julio Ricardo Martínez Montezuma",
  logo:"https://campusvirtual.unicomfacauca.edu.co/pluginfile.php/46925/course/overviewfiles/CURVAS-Logo-acreditacio%CC%81n-institucional-2022-01-2.png",
  actividades:[
    {nombre:"Taller C1S2",porcentaje:10},
    {nombre:"Taller C1S5",porcentaje:80}
  ]
};
/* Formato por estudiante: "documento": {nombre, notas, acumulados, asistencia, definitiva}. */
const ESTUDIANTES={
  "1150185516":{nombre:"CASTILLO ORDOÑEZ DAVID ALEJANDRO",notas:[1.0,3.3],acumulados:[0.10,2.64],asistencia:0.4,definitiva:3.1},
  "1081277513":{nombre:"CLAVIJO REYES SANTIAGO ANDRES",notas:[1.0,3.4],acumulados:[0.10,2.72],asistencia:0.4,definitiva:3.2},
  "1085660280":{nombre:"DURAN RODRIGUEZ JHONIER ALFREDO",notas:[5.0,2.0],acumulados:[0.50,1.60],asistencia:0.1,definitiva:2.2},
  "1061686954":{nombre:"GOMEZ RUIZ WILSON ALEJANDRO",notas:[1.0,3.1],acumulados:[0.10,2.48],asistencia:0.4,definitiva:3.0},
  "1060870506":{nombre:"GUAMPE LLANTEN JULIAN DAVID",notas:[1.0,2.7],acumulados:[0.10,2.16],asistencia:0.4,definitiva:2.7},
  "1058549207":{nombre:"MASABUEL VALENCIA DANIEL ANDRES",notas:[5.0,2.5],acumulados:[0.50,2.00],asistencia:0.5,definitiva:3.0},
  "1029602345":{nombre:"MONTENEGRO ACHINTE JINETH CAROLINA",notas:[5.0,2.4],acumulados:[0.50,1.92],asistencia:0.4,definitiva:2.8},
  "1059474502":{nombre:"MUÑOZ JIMENEZ JUAN DIEGO",notas:[1.0,3.4],acumulados:[0.10,2.68],asistencia:0.2,definitiva:3.0},
  "1063434525":{nombre:"ORDOÑEZ ANACONA MAIKOL GABRIEL",notas:[1.0,1.0],acumulados:[0.10,0.80],asistencia:0.3,definitiva:1.2},
  "1062078697":{nombre:"OSSA ROGER ALEXIS",notas:[1.0,1.0],acumulados:[0.10,0.80],asistencia:0.1,definitiva:1.0},
  "1058933403":{nombre:"POLO MOLINA GERMAN ESTEBAN",notas:[5.0,4.0],acumulados:[0.50,3.20],asistencia:0.5,definitiva:4.2},
  "1025530060":{nombre:"RAIGOSA PIÑEROS ADRIAN SANTIAGO",notas:[1.0,2.7],acumulados:[0.10,2.16],asistencia:0.3,definitiva:2.6},
  "1061710558":{nombre:"ROSERO TROCHEZ DIEGO ALEJANDRO",notas:[1.0,3.4],acumulados:[0.10,2.72],asistencia:0.4,definitiva:3.2},
  "1002950105":{nombre:"SANCHEZ PACUE YERSLI LUANA",notas:[5.0,2.4],acumulados:[0.50,1.92],asistencia:0.5,definitiva:2.9},
  "1004249724":{nombre:"TOLEDO PINTO JONIER",notas:[5.0,3.1],acumulados:[0.50,2.48],asistencia:0.5,definitiva:3.5},
  "1061432838":{nombre:"YATACUE DAGUA ALAN JHONIER",notas:[5.0,4.0],acumulados:[0.50,3.20],asistencia:0.3,definitiva:4.0},
  "1062082171":{nombre:"YOTENGO PACHONGO JOHAN SEBASTIAN",notas:[5.0,2.2],acumulados:[0.50,1.76],asistencia:0.5,definitiva:2.8}
};

const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});
const fmtId=id=>id.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const faltasPorAcumulado={"0.5":0,"0.4":1,"0.3":2,"0.2":3,"0.1":4,"0.0":5};
function iniciar(){document.title=`Consulta de notas — ${CONFIG.asignatura}`;$('logo').src=CONFIG.logo;$('titulo').textContent=CONFIG.titulo;$('periodo').textContent=CONFIG.periodo;$('asignatura').textContent=CONFIG.asignatura;$('programa').textContent=CONFIG.programa;$('docente').textContent=CONFIG.docente}
function ocultar(){$('resultado').style.display='none';$('mensaje').style.display='none'}
function fila(celdas){const tr=document.createElement('tr');celdas.forEach((valor,i)=>{const td=document.createElement('td');td.textContent=valor;if(i===1&&Number(valor.replace?.(',','.'))<3)td.classList.add('perdida');tr.appendChild(td)});return tr}
$('formulario').addEventListener('submit',e=>{e.preventDefault();const id=$('documento').value.replace(/\D/g,''),d=ESTUDIANTES[id];ocultar();if(!d){$('mensaje').style.display='block';return}
  $('idSalida').textContent=fmtId(id);$('nombreSalida').textContent=d.nombre;$('programaSalida').textContent=CONFIG.codigoPrograma;$('filas').replaceChildren();
  CONFIG.actividades.forEach((a,i)=>$('filas').appendChild(fila([a.nombre,fmt(d.notas[i]),`${fmt(a.porcentaje)}%`,fmt(d.acumulados[i])])));
  $('filas').appendChild(fila(['Faltas',String(faltasPorAcumulado[Number(d.asistencia).toFixed(1)]),'10%',fmt(d.asistencia)]));
  $('definitiva').textContent=fmt(d.definitiva);$('definitiva').classList.toggle('perdida',d.definitiva<3);$('resultado').style.display='block'
});
$('limpiar').addEventListener('click',()=>{$('documento').value='';ocultar();$('documento').focus()});
iniciar();
</script>
</body>
</html>
